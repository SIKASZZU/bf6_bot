name: Build and Syntax check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile project (Syntax check and bytecode build)
        run: python -m compileall main.py

      - name: Import project (Executes actual code and does the flow)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TOKEN_DEV: ${{ secrets.DISCORD_TOKEN_DEV }}
        run: python -c "import main"
